name: CloudMarket Quality Gate

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

permissions:
  contents: read

jobs:
  api:
    name: API tests and syntax
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: mbstring, pdo_mysql
          coverage: none
      - name: Install PHP dependencies
        working-directory: api
        run: composer install --no-interaction --prefer-dist --no-progress
      - name: Run unit tests
        working-directory: api
        run: vendor/bin/phpunit
      - name: Check PHP syntax
        run: |
          find api/src api/routes api/database -name '*.php' -print0 | xargs -0 -n1 php -l

  admin:
    name: Admin type-check and build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: admin/package-lock.json
      - name: Install web dependencies
        working-directory: admin
        run: npm ci
      - name: Type-check
        working-directory: admin
        run: npm run type-check
      - name: Build admin
        working-directory: admin
        run: npm run build

  mobile:
    name: Mobile analyze, test and build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.27.4'
          channel: stable
          cache: true
      - name: Install Flutter dependencies
        working-directory: mobile
        run: flutter pub get
      - name: Analyze mobile source
        working-directory: mobile
        run: flutter analyze
      - name: Run mobile tests
        working-directory: mobile
        run: flutter test
      - name: Verify Android debug APK compiles
        working-directory: mobile
        run: flutter build apk --debug
